name: Atualizacao Diaria Guia SC Turismo

on:
  schedule:
    # 09:00 UTC = 06:00 horário de Brasília
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar Scraper de Notícias
        run: python scraper.py

      - name: Salvar Dados Atualizados
        run: |
          git config --global user.name "Bot Guia SC"
          git config --global user.email "bot@guiasc.com"
          git add dados.json
          git commit -m "Atualização matinal das notícias de SC [Automático]" || exit 0
          git push
